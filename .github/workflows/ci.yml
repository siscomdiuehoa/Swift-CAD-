name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core - build va kiem thu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/SwiftCad.Core.Tests -c Release
      - name: Kiem thu doc DWG/DXF (ACadSharp) va do tep lon 300.000 doi tuong
        shell: bash
        run: |
          mkdir -p /tmp/perf
          SWIFTCAD_PERF=300000 SWIFTCAD_PERF_KEEP=/tmp/perf dotnet run --project tests/SwiftCad.Cad.Tests -c Release
          for f in /tmp/perf/swiftcad-perf.dxf /tmp/perf/swiftcad-perf.dwg; do
            R=$(SWIFTCAD_PERF_READ=$f dotnet tests/SwiftCad.Cad.Tests/bin/Release/net10.0/SwiftCad.Cad.Tests.dll | grep PERF)
            echo "::notice::$R (may Linux CI, khong phai dien thoai)"
          done

  android:
    name: Android - build APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - run: dotnet workload list
      - name: Tao cau hinh Firebase tu Secret (khong luu trong repo)
        env:
          FB_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FB_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: python3 tools/ci/firebase_config.py
      - name: Build APK (ky bang khoa debug, chi de thu)
        run: dotnet publish src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-android -c Release -p:SwiftCadPlatform=android -p:AndroidPackageFormat=apk -o artifacts/android
      - name: Dat ten APK theo phien ban va commit, ghi SHA-256
        shell: bash
        run: |
          set -euo pipefail
          VER=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' src/SwiftCad.App/SwiftCad.App.csproj)
          BUILD=$(grep -oP '(?<=<ApplicationVersion>)[^<]+' src/SwiftCad.App/SwiftCad.App.csproj)
          SHA=$(git rev-parse --short=7 HEAD)
          SIGNED=$(ls artifacts/android/*-Signed.apk | head -1)
          OUT="artifacts/SwiftCad-${VER}-build${BUILD}-${SHA}-debugsigned.apk"
          cp "$SIGNED" "$OUT"
          SUM=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "$SUM  $(basename "$OUT")" > "$OUT.sha256"
          echo "::notice::APK thu nghiem $(basename "$OUT") (ky bang khoa debug), SHA-256 $SUM"
          { echo "### APK thu nghiem"; echo; echo "- Tep: \`$(basename "$OUT")\`"; echo "- Phien ban: $VER (build $BUILD), commit \`$SHA\`"; echo "- SHA-256: \`$SUM\`"; echo "- Ky bang khoa debug: chi de cai thu, khong dua len Play"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: swiftcad-android-apk
          path: |
            artifacts/SwiftCad-*.apk
            artifacts/SwiftCad-*.apk.sha256
          if-no-files-found: error

  ios-device:
    name: iOS - build thiet bi that ios-arm64 (khong ky)
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Cai workload iOS khop Xcode
        run: |
          tools/ci/run.sh python3 tools/ci/pin_ios_workload.py
          tools/ci/run.sh dotnet workload install maui-ios --from-rollback-file rollback.json
      - name: Tao cau hinh Firebase tu Secret (khong luu trong repo)
        env:
          FB_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FB_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: python3 tools/ci/firebase_config.py
      - name: Build ios-arm64 Release (AOT, khong ky) de kiem tra bien dich cho iPhone that
        shell: bash
        run: |
          tools/ci/run.sh dotnet build src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-ios -c Release -p:SwiftCadPlatform=ios -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false
          grep -E "warning (IL2|IL3)" /tmp/run-out.log | sort -u | head -40 | sed 's/^/::warning::/' || true
          echo "::notice::So canh bao trimming/AOT (IL2xxx/IL3xxx): $(grep -cE 'warning (IL2|IL3)' /tmp/run-out.log || true)"

  ios-simulator:
    name: iOS - build cho simulator (khong ky)
    runs-on: macos-26
    needs: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Xcode tren may chay
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app | sed 's/^/::notice::Co san: /'
          # Dung Xcode mac dinh cua may chay; workload iOS duoc ghim theo phien ban nay o buoc sau.
          echo "::notice::Xcode mac dinh: $(xcode-select -p) / $(xcodebuild -version | head -1)"
      - name: Cai workload iOS khop Xcode
        run: |
          tools/ci/run.sh python3 tools/ci/pin_ios_workload.py
          tools/ci/run.sh dotnet workload install maui-ios --from-rollback-file rollback.json
      - run: dotnet workload list
      - name: Tao cau hinh Firebase tu Secret (khong luu trong repo)
        env:
          FB_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FB_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: python3 tools/ci/firebase_config.py
      - name: Build iOS simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version; dotnet --version; dotnet workload list
          dotnet build src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-ios -c Debug -p:SwiftCadPlatform=ios -p:RuntimeIdentifier=iossimulator-arm64 2>&1 | tee build.log || { grep -E ": (error|warning) " build.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }
