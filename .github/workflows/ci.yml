name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core - build va kiem thu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/SwiftCad.Core.Tests -c Release

  android:
    name: Android - build APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - run: dotnet workload list
      - name: Build APK (ky bang khoa debug, chi de thu)
        run: dotnet publish src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -o artifacts/android
      - uses: actions/upload-artifact@v4
        with:
          name: swiftcad-android-apk
          path: artifacts/android/*.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS - build cho simulator (khong ky)
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios
      - run: dotnet workload list
      - name: Build iOS simulator
        run: dotnet build src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
