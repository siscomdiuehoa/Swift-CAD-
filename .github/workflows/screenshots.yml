name: Anh chay that va kiem tra luong

# Chay tren pull request va chay tay. Dung ban build co ShotMode (-p:SwiftCadShots=true), khong phai ban phat hanh.
on:
  pull_request:
  # Kiem thu am: day nhanh selftest/android-flow, selftest/ios-create hoac selftest/ios-shot (job tuong ung phai do).
  push:
    branches: ['selftest/**']
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Kiem thu am (job phai do): none | android-flow | ios-create | ios-shot'
        default: none
        type: choice
        options: [none, android-flow, ios-create, ios-shot]

permissions:
  contents: read

env:
  SWIFTCAD_SELFTEST: ${{ (inputs.selftest || (github.ref_name == 'selftest/android-flow' && 'android-flow') || (github.ref_name == 'selftest/ios-create' && 'ios-create') || (github.ref_name == 'selftest/ios-shot' && 'ios-shot') || 'none') }}

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Cau hinh lan chay
    runs-on: ubuntu-latest
    outputs:
      selftest: ${{ steps.s.outputs.selftest }}
    steps:
      - id: s
        run: |
          echo "selftest=$SWIFTCAD_SELFTEST" >> "$GITHUB_OUTPUT"
          echo "::notice::Kiem thu am: $SWIFTCAD_SELFTEST"

  android-apk:
    name: Android - build APK chup anh
    runs-on: ubuntu-latest
    needs: config
    if: ${{ !startsWith(needs.config.outputs.selftest, 'ios-') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - name: Tao cau hinh Firebase tu Secret (khong luu trong repo)
        env:
          FB_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FB_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: python3 tools/ci/firebase_config.py
      - run: dotnet publish src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-android -c Release -p:SwiftCadPlatform=android -p:SwiftCadShots=true -p:AndroidPackageFormat=apk -o artifacts/android
      - uses: actions/upload-artifact@v5
        with:
          name: apk-shots
          path: artifacts/android/*.apk
          if-no-files-found: error

  android-shots:
    name: Android emulator - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [config, android-apk]
    if: ${{ needs.config.outputs.selftest == 'none' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: w360-en, size: 1080x2340, density: 480, locale: en-US, font: '1.0' }
          - { name: w360-vi, size: 1080x2340, density: 480, locale: vi-VN, font: '1.0' }
          - { name: w390-en, size: 1170x2532, density: 480, locale: en-US, font: '1.0' }
          - { name: w390-vi, size: 1170x2532, density: 480, locale: vi-VN, font: '1.0' }
          - { name: w360-en-font130, size: 1080x2340, density: 480, locale: en-US, font: '1.3' }
          - { name: w360-vi-font130, size: 1080x2340, density: 480, locale: vi-VN, font: '1.3' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apk-shots
          path: artifacts/android
      - name: Bat KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tools/ci/shots.py artifacts/android "${{ matrix.name }}" "${{ matrix.size }}" "${{ matrix.density }}" "${{ matrix.locale }}" "${{ matrix.font }}"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-shots-${{ matrix.name }}
          path: artifacts/shots

  android-flow:
    name: Android emulator - kiem tra luong thao tac that
    runs-on: ubuntu-latest
    needs: [config, android-apk]
    if: ${{ needs.config.outputs.selftest == 'none' || needs.config.outputs.selftest == 'android-flow' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apk-shots
          path: artifacts/android
      - name: Bat KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tools/ci/flow.py artifacts/android
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-flow
          path: artifacts/flow

  ios-shots:
    name: iOS simulator - build, chay va chup anh
    runs-on: macos-26
    needs: config
    if: ${{ needs.config.outputs.selftest == 'none' || startsWith(needs.config.outputs.selftest, 'ios-') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Xcode tren may chay
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app | sed 's/^/::notice::Co san: /'
          # Dung Xcode mac dinh cua may chay; workload iOS duoc ghim theo phien ban nay o buoc sau.
          echo "::notice::Xcode mac dinh: $(xcode-select -p) / $(xcodebuild -version | head -1)"
      - name: Cai workload iOS khop Xcode
        run: |
          tools/ci/run.sh python3 tools/ci/pin_ios_workload.py
          tools/ci/run.sh dotnet workload install maui-ios --from-rollback-file rollback.json
      - name: Tao cau hinh Firebase tu Secret (khong luu trong repo)
        env:
          FB_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FB_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: python3 tools/ci/firebase_config.py
      - name: Build iOS simulator co ShotMode
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-ios -c Debug -p:SwiftCadPlatform=ios -p:SwiftCadShots=true -p:RuntimeIdentifier=iossimulator-arm64 2>&1 | tee build.log || { grep -E ": (error|warning) " build.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Chup anh
        run: |
          APP=$(find src/SwiftCad.App/bin/Debug -name "*.app" -maxdepth 4 -type d | head -1)
          echo "App: $APP"
          tools/ci/run.sh python3 tools/ci/ios_shots.py "$APP"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-shots
          path: artifacts/ios-shots

  publish:
    name: Dang anh len nhanh ci-screenshots theo PR
    runs-on: ubuntu-latest
    needs: [config, android-shots, android-flow, ios-shots]
    # Kiem thu am khong duoc ghi de anh cua lan chay hop le.
    if: ${{ always() && needs.config.outputs.selftest == 'none' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: shots
          pattern: '{android-shots-*,android-flow,ios-shots}'
      - name: Day anh len nhanh mo coi rieng cho PR
        shell: bash
        run: |
          cd shots
          {
            echo "# Anh chay that - commit ${{ github.event.pull_request.head.sha || github.sha }}"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            find . -name '*.txt' | sort | while read f; do echo "## $f"; echo '```'; cat "$f"; echo '```'; done
          } > README.md
          B=ci-screenshots${{ github.event.pull_request.number && format('-pr{0}', github.event.pull_request.number) || '' }}
          [ "${{ github.event.pull_request.number }}" = "2" ] && B=ci-screenshots
          git init -q -b "$B"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Anh chay that cho ${{ github.event.pull_request.head.sha || github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
