name: iOS TestFlight noi bo

# Tai ban thu len TestFlight cho nhom thu nghiem NOI BO. Khong phat hanh cong khai.
# Chay: day nhanh testflight/** (Claude day khi Owner yeu cau), hoac chay tay khi workflow da co tren main.
# Secret can co (Settings > Secrets and variables > Actions), khong dua vao ma hay binh luan:
#   ASC_KEY_ID      Key ID cua khoa App Store Connect API (vai tro Admin)
#   ASC_ISSUER_ID   Issuer ID (trang Users and Access > Integrations)
#   ASC_KEY_P8      dan nguyen noi dung tep AuthKey_xxxx.p8 (ca dong BEGIN/END)
# Ma dinh danh ung dung lay tu <ApplicationId> trong src/SwiftCad.App/SwiftCad.App.csproj.
on:
  push:
    branches: ['testflight/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Kiem tra du secret
        shell: bash
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Thieu secret:$missing (xem docs/v1-ban-cai-thu.md)"; exit 1; fi
      - uses: actions/checkout@v5
      - name: Ma dinh danh va so build
        shell: bash
        run: |
          ID=$(grep -oP '(?<=<ApplicationId>)[^<]+' src/SwiftCad.App/SwiftCad.App.csproj || sed -n 's:.*<ApplicationId>\(.*\)</ApplicationId>.*:\1:p' src/SwiftCad.App/SwiftCad.App.csproj)
          if [ "$ID" = "com.swiftcad.app" ]; then echo "::error::ApplicationId van la ma tam com.swiftcad.app; cap nhat bang Bundle ID that cua Swift CAD Viewer"; exit 1; fi
          echo "BUNDLE_ID=$ID" >> "$GITHUB_ENV"
          echo "BUILD_NO=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "::notice::Bundle ID $ID, build $((1000 + ${{ github.run_number }})), commit $(git rev-parse --short HEAD)"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Cai workload iOS khop Xcode
        run: |
          tools/ci/run.sh python3 tools/ci/pin_ios_workload.py
          tools/ci/run.sh dotnet workload install maui-ios --from-rollback-file rollback.json
      - name: Tao chung chi va ho so tam thoi qua App Store Connect API
        shell: bash
        run: |
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]==2.10.1" || python3 -m pip install --quiet "pyjwt[crypto]==2.10.1"
          python3 tools/ci/asc_signing.py setup "$BUNDLE_ID" "$RUNNER_TEMP/signing"
      - name: Nap vao keychain tam
        shell: bash
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/signing"; KC="$RUNNER_TEMP/build.keychain-db"; KPW=$(uuidgen)
          PW=$(python3 -c "import json;print(json.load(open('$S/ids.json'))['p12_password'])")
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$S/dist.p12" -P "$PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$S/app.mobileprovision" | plutil -extract UUID raw -)
          cp "$S/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          rm -f "$S/dist.p12"
      - name: Build IPA ky (Release, ios-arm64)
        shell: bash
        run: |
          tools/ci/run.sh dotnet publish src/SwiftCad.App/SwiftCad.App.csproj -f net10.0-ios -c Release \
            -p:SwiftCadPlatform=ios -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true \
            -p:ApplicationVersion=$BUILD_NO -p:CodesignKey="Apple Distribution" -p:CodesignProvision="$PROFILE_UUID" -o artifacts/ios
          ls -la artifacts/ios
      - name: Tai len TestFlight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls artifacts/ios/*.ipa | head -1)
          tools/ci/run.sh xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Da tai $(basename "$IPA") len TestFlight (build $BUILD_NO). Apple xu ly 5-30 phut truoc khi hien trong TestFlight."
      - name: Xoa chung chi, ho so va khoa tam
        if: always()
        shell: bash
        run: |
          python3 tools/ci/asc_signing.py cleanup "$RUNNER_TEMP/signing" || true
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/signing"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
